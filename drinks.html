<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>お飲み物｜鮨磯</title>
<style>
*{box-sizing:border-box}
html{background:#050505}
body{
  margin:0;background:#050505;color:#f3f0e8;
  font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
}
.wrap{max-width:900px;margin:auto;padding:26px 22px 70px}
header{border-bottom:1px solid rgba(194,157,78,.55);padding:0 0 20px;margin-bottom:45px}
.logo{
  display:inline-block;color:#e2c06f;text-decoration:none;
  font-family:"Yuji Syuku","HG正楷書体-PRO","HGP行書体","Yu Mincho",serif;
  font-size:30px;font-weight:700;letter-spacing:.12em
}
h1{
  margin:0;text-align:center;color:#e2c06f;font-size:42px;
  font-family:"Yuji Syuku","HG正楷書体-PRO","HGP行書体","Yu Mincho",serif;
  letter-spacing:.13em
}
.lead{text-align:center;color:#d4d0c8;margin:12px 0 42px;letter-spacing:.1em}
.menu{max-width:720px;margin:auto}
.category{
  color:#d8b65f;font-size:22px;font-weight:700;letter-spacing:.12em;
  border-bottom:1px solid rgba(194,157,78,.35);padding-bottom:8px;margin:34px 0 8px
}
.row{
  display:grid;grid-template-columns:1fr auto;gap:18px;
  padding:13px 4px;border-bottom:1px solid rgba(255,255,255,.09);align-items:start
}
.name{font-size:17px;line-height:1.6}
.desc{display:block;color:#aaa;font-size:13px;margin-top:2px}
.price{white-space:nowrap;color:#eee;font-size:16px;padding-top:2px}
.note{text-align:center;color:#999;font-size:12px;margin-top:38px}
.back{text-align:center;margin-top:40px}
.back a{
  display:inline-block;color:#e0c170;text-decoration:none;border:1px solid #b89445;
  padding:11px 26px;letter-spacing:.12em
}
@media(max-width:600px){
  .wrap{padding:20px 16px 55px}
  h1{font-size:34px}
  .row{grid-template-columns:1fr auto;gap:10px}
  .name{font-size:15px}.price{font-size:14px}
}
</style>
</head>
<body>
<div class="wrap">
<header><a class="logo" href="index.html">鮨磯</a></header>

<main>
<h1>お飲み物</h1>
<p class="lead">お料理に合わせて、いろいろご用意しております。</p>

<div class="menu">
  <div class="category">ビール</div>
  <div class="row"><div class="name">生ビール　キリン一番搾り</div><div class="price">700円（税別）</div></div>
  <div class="row"><div class="name">キリン ハートランド　中瓶<span class="desc">キリンビールが作っている麦芽100%の瓶ビールです。</span></div><div class="price">800円（税別）</div></div>
  <div class="row"><div class="name">アサヒ スーパードライ　中瓶<span class="desc">今や日本の定番です。</span></div><div class="price">800円（税別）</div></div>

  <div class="category">焼酎</div>
  <div class="row"><div class="name">焼酎<span class="desc">麦・米・芋、いろいろ取り揃えております。</span></div><div class="price">600円〜（税別）</div></div>

  <div class="category">ワイン</div>
  <div class="row"><div class="name">白ワイン（グラス）<span class="desc">勝沼市 池田ワイナリー　辛口</span></div><div class="price">800円（税別）</div></div>

  <div class="category">ソフトドリンク</div>
  <div class="row"><div class="name">ソフトドリンク</div><div class="price">300円〜（税別）</div></div>
</div>

<p class="note">※仕入れ状況により内容が変わる場合がございます。</p>
<div class="back"><a href="index.html">トップページへ戻る</a></div>
</main>
</div>
</body>
</html>
