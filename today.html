<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="鮨磯 本日のお料理">
  <title>本日のお料理｜鮨磯</title>
  <style>
    :root{--ink:#090909;--paper:#f3efe7;--gold:#ba985b;--line:rgba(186,152,91,.38)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--ink);color:var(--paper);font-family:"Yu Mincho","Hiragino Mincho ProN",serif;line-height:1.9}
    a{color:inherit;text-decoration:none}
    .nav{display:flex;align-items:center;justify-content:space-between;padding:28px clamp(22px,5vw,80px);border-bottom:1px solid rgba(255,255,255,.12)}
    .brand{font-size:1.8rem;letter-spacing:.3em}
    .back{border:1px solid var(--gold);padding:10px 20px;color:#e5c787;font-family:sans-serif;font-size:.78rem;letter-spacing:.12em;transition:.25s}
    .back:hover{background:var(--gold);color:#090909}
    main{padding:clamp(80px,12vw,150px) clamp(24px,8vw,130px)}
    .kicker{color:var(--gold);font:12px sans-serif;letter-spacing:.3em}
    h1{font-weight:400;font-size:clamp(2.5rem,6vw,5rem);line-height:1.4;letter-spacing:.12em;margin:.35em 0}
    .dishes{margin-top:50px;border-top:1px solid var(--line)}.dish{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:24px;align-items:center;padding:28px 0;border-bottom:1px solid var(--line)}.dish-name{font-size:1.2rem;letter-spacing:.08em}.dish-price{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#f0d59f;font-size:1.15rem;font-weight:600;white-space:nowrap;text-align:right}
    footer{padding:44px clamp(24px,8vw,130px);border-top:1px solid #29251f;color:#81796e;font:11px sans-serif;letter-spacing:.18em}
    @media(max-width:720px){.nav{padding:20px}.brand{font-size:1.4rem}main{padding-top:80px}}
  </style>
</head>
<body>
  <header class="nav">
    <a class="brand" href="index.html">鮨磯</a>
    <a class="back" href="index.html#menu">お品書きへ戻る</a>
  </header>
  <main>
    <span class="kicker">TODAY'S DISHES</span>
    <h1>本日のお料理</h1>
    <div class="dishes"><div class="dish"><div class="dish-name">メカブ酢</div><div class="dish-price">¥300（税別）</div></div><div class="dish"><div class="dish-name">ホタテの磯辺焼き</div><div class="dish-price">¥800（税別）</div></div><div class="dish"><div class="dish-name">子持ち昆布</div><div class="dish-price">¥1,000（税別）</div></div><div class="dish"><div class="dish-name">焼き大アサリ</div><div class="dish-price">¥1,000（税別）</div></div><div class="dish"><div class="dish-name">焼きはまぐり</div><div class="dish-price">¥1,200（税別）</div></div><div class="dish"><div class="dish-name">しめ鯵のガリ巻き</div><div class="dish-price">¥1,500（税別）</div></div><div class="dish"><div class="dish-name">マグロの顎塩焼き</div><div class="dish-price">¥1,500（税別）</div></div><div class="dish"><div class="dish-name">マグロ脳天の中落ち</div><div class="dish-price">¥1,800（税別）</div></div></div>
  </main>
  <footer>© 2026 SUSHI ISO</footer>
</body>
</html>
