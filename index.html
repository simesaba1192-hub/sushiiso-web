<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鮨磯</title></head><body><script>
fetch('index_base.html').then(r=>r.text()).then(html=>{
html=html.replace('その日の仕入れで、旬の味わいを丁寧に握ります。','');
html=html.replace(/const months = \[[\s\S]*?\];/, 'const months = [\n  {year:2026, month:9, specials:[13,14]},\n  {year:2026, month:10, specials:[17,24,25]}\n];');
const drinks='\n<section class="section drinks-added" id="drinks"><div class="section-title old-sushi-type">お飲み物</div><p class="section-lead">いろいろご用意しております。</p><a class="drinks-banner" href="drinks.html">お飲み物を見る</a></section><style>.drinks-added{text-align:center;border-top:1px solid rgba(200,165,92,.35);padding-top:34px;padding-bottom:42px}.drinks-added .section-title{color:#d5b76a;font-size:clamp(25px,3vw,36px);margin-bottom:10px}.drinks-added .section-lead{color:#ddd;margin:0 0 22px;letter-spacing:.08em}.drinks-banner{display:inline-block;min-width:220px;padding:13px 28px;border:1px solid #b89445;color:#e3c577;text-decoration:none;letter-spacing:.12em;background:rgba(0,0,0,.35);transition:.2s ease}.drinks-banner:hover{background:#b89445;color:#080808}</style>\n';
if(!html.includes('id="drinks"')) html=html.replace('<section class="interior"',drinks+'<section class="interior"');
document.open();document.write(html);document.close();
}).catch(()=>{document.body.innerHTML='<p style="color:white;background:black;padding:30px">ページを読み込めませんでした。</p>'});
<\/script></body></html>
