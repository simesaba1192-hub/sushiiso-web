cfg = months[current];\n    const y = cfg.year, m = cfg.month;\n    document.getElementById('calTitle').textContent = y + '年 ' + (m+1) + '月';\n    const first = new Date(y,m,1).getDay();\n    const days = new Date(y,m+1,0).getDate();\n    let s = '<table><thead><tr><th>日<\/th><th>月<\/th><th>火<\/th><th>水<\/th><th>木<\/th><th>金<\/th><th>土<\/th><\/tr><\/thead><tbody><tr>';\n    for(let i=0;i<first;i++) s += '<td class=\"empty\"><\/td>';\n    for(let d=1; d<=days; d++){\n      const dow = new Date(y,m,d).getDay();\n      const isWed = dow===3;\n      const isSpecial = cfg.specials.includes(d);\n      const cls = (isWed || isSpecial) ? ('closed' + (isSpecial?' special':'')) : '';\n      s += '<td class=\"'+cls+'\">'+d+'<\/td>';\n      if((first+d)%7===0 && d!==days) s += '<\/tr><tr>';\n    }\n    const used=(first+days)%7;\n    if(used!==0) for(let i=used;i<7;i++) s += '<td class=\"empty\"><\/td>';\n    s += '<\/tr><\/tbody><\/table>';\n    s += '<div class=\"month-hint\">左右の矢印で 9月・10月・11月を切り替えられます<\/div>';\n    document.getElementById('calendarBody').innerHTML=s;\n    document.querySelectorAll('.cal-arrow')[0].disabled = current===0;\n    document.querySelectorAll('.cal-arrow')[1].disabled = current===months.length-1;\n  }\n  window.changeMonth=function(n){ current=Math.max(0,Math.min(months.length-1,current+n)); render(); };\n  render();\n})();\n<\/script>\n\n<\/body><\/html>";refs.forEach((ref,i)=>{const image=images.find(v=>v.length===ref.length&&v.startsWith(ref.first)&&v.endsWith(ref.last));html=html.replace("__ISO_IMAGE_"+i+"__",image||images[i]||"")});document.open();document.write(html);document.close()}).catch(()=>{document.body.innerHTML="<p style=\"padding:30px\">ページを読み込めませんでした。再読み込みしてください。</p>"});
